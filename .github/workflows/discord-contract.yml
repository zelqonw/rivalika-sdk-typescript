# Generated; offline and secret-free. Fork PR code never runs on persistent runners.
name: Notification contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rivalika, light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/notifications/check-generated.mjs
      - run: node --test scripts/notifications/*.test.mjs
