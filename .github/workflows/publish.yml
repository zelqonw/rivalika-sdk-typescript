name: Publish

# Publishing is a tag decision, not a branch decision.
#
# The GitLab pipeline this replaces was pinned to one literal tag
# (v1.0.0-beta.1), so shipping any later version meant editing CI. Neither
# that tag nor the package ever made it out. `v*` is the rule that was
# intended.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing validated release tag to publish or retry
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    name: npm
    # Registry provenance requires a GitHub-hosted signing environment.
    runs-on: ubuntu-latest
    environment: npm
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      # Trusted publishing uses this after the one-time bootstrap token has
      # created the package and the npm publisher relationship is configured.
      id-token: write
    steps:
      - name: Validate release reference
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "An existing version tag is required" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm must be new enough to publish with OIDC
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-cli" npm@latest
          echo "$RUNNER_TEMP/npm-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/npm-cli/node_modules/.bin/npm" --version
      - run: npm ci
      - run: npm run check
      - name: the tag must match the manifest
        # A tag that disagrees with package.json publishes a version nobody
        # asked for, under a name the tag does not describe.
        run: |
          TAG="${RELEASE_TAG#v}"
          MANIFEST="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag ${RELEASE_TAG} does not match package.json ${MANIFEST}" >&2
            exit 1
          fi
      - run: npm publish --tag beta
        env:
          # npm cannot use trusted publishing until the package exists. Keep
          # this token only for the first publication, then remove it once the
          # package's trusted publisher has been configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  notification-outcome:
    name: Record notification outcome
    continue-on-error: true
    if: always()
    needs: [publish]
    runs-on: [self-hosted, rivalika, light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Write sanitized outcome
        env:
          NOTIFY_KIND: publish
          NOTIFY_VERSION: ${{ inputs.tag || github.ref_name }}
          NOTIFY_RELEASE: ${{ github.sha }}
          NOTIFY_OUTCOME: ${{ needs.publish.result == 'success' && 'published' || needs.publish.result == 'failure' && 'failed' || 'unknown' }}
          NOTIFY_STAGE: ${{ needs.publish.result == 'success' && 'complete' || 'package publication' }}
        run: node scripts/notifications/write-outcome.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notification-outcome-${{ github.run_attempt }}-publish
          path: output/notifications/outcome.json
          retention-days: 14
