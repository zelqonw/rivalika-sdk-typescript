name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests and package
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rivalika, light]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: clean package install
        run: |
          rm -f "$RUNNER_TEMP"/rivalika-sdk-*.tgz
          rm -rf "$RUNNER_TEMP/rivalika-consumer"
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/rivalika-consumer"
          cd "$RUNNER_TEMP/rivalika-consumer"
          npm init -y
          npm install "$RUNNER_TEMP"/rivalika-sdk-*.tgz
          node -e "const {IntegrationClient}=require('@rivalika/sdk'); if(typeof IntegrationClient!=='function')process.exit(1)"
          node --input-type=module -e "import {IntegrationClient} from '@rivalika/sdk'; if(typeof IntegrationClient!=='function')process.exit(1)"

  drift:
    name: generation drift
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, rivalika, heavy]
    # The SDK is generated, not written. If the committed tree and a fresh
    # generation from the same spec disagree, someone hand-edited generated
    # code and the next sync would silently revert them.
    steps:
      - uses: actions/checkout@v6
      - name: regenerate
        # As the runner user, not in a root job container: root-owned files in
        # the persistent workspace break every later checkout on this runner.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            --entrypoint openapi-generator-cli \
            openapitools/openapi-generator-cli:v7.22.0 \
            generate -c openapi-generator-config.json
      - name: the tree must be unchanged
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
