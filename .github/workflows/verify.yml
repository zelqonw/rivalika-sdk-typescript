name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: clean package install
        run: |
          npm pack --pack-destination /tmp
          mkdir /tmp/rivalika-consumer
          cd /tmp/rivalika-consumer
          npm init -y
          npm install /tmp/rivalika-sdk-*.tgz
          node -e "const {IntegrationClient}=require('@rivalika/sdk'); if(typeof IntegrationClient!=='function')process.exit(1)"
          node --input-type=module -e "import {IntegrationClient} from '@rivalika/sdk'; if(typeof IntegrationClient!=='function')process.exit(1)"

  drift:
    name: generation drift
    runs-on: ubuntu-latest
    # The SDK is generated, not written. If the committed tree and a fresh
    # generation from the same spec disagree, someone hand-edited generated
    # code and the next sync would silently revert them.
    container:
      image: openapitools/openapi-generator-cli:v7.22.0
      options: --entrypoint ''
    steps:
      # Before the checkout, not after: actions/checkout falls back to
      # downloading a source tarball when git is missing, and a tree with no
      # .git in it cannot be diffed. That failure looks like a git usage
      # error, which is a long way from its cause.
      - name: install git
        run: |
          apt-get update -qq && apt-get install -y -qq git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/checkout@v6
      - name: regenerate
        run: openapi-generator-cli generate -c openapi-generator-config.json
      - name: the tree must be unchanged
        run: git diff --exit-code
