# Generated; update through the notification generator.
name: Discord notifications
on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, review_requested]
  issues:
    types: [labeled, reopened, closed]
  workflow_run:
    workflows: ['Verify', 'Publish', 'Sync OpenAPI']
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  notify:
    runs-on: [self-hosted, rivalika, light]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check generated notification files
        run: node scripts/notifications/check-generated.mjs
      - name: Deliver filtered notifications
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_GIT_WEBHOOK_URL: ${{ secrets.DISCORD_GIT_WEBHOOK_URL }}
          DISCORD_CICD_WEBHOOK_URL: ${{ secrets.DISCORD_CICD_WEBHOOK_URL }}
        run: node scripts/notifications/notify.mjs
