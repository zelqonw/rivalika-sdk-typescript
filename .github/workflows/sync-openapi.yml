name: Sync OpenAPI

# The monorepo sends this when its public API spec changes on main.
#
# GitLab did it with a cross-project pipeline trigger authenticated by
# JOB-TOKEN. GitHub has no equivalent, so the monorepo dispatches and this
# regenerates. The spec is ~256 KB, well over the 64 KB a client_payload can
# carry, so the payload names the commit and this job fetches it.
on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      spec_sha:
        description: Monorepo commit to generate from
        required: true

permissions:
  contents: read

concurrency:
  group: sync-openapi
  cancel-in-progress: false

env:
  SPEC_REPO: zelqonw/rivalika
  SPEC_PATH: packages/contracts/openapi/generated/rivalika-public-api.json

jobs:
  regenerate:
    outputs:
      source: ${{ steps.request.outputs.sha }}
      pr: ${{ steps.pull-request.outputs.pull-request-number }}
      operation: ${{ steps.pull-request.outputs.pull-request-operation }}
    name: regenerate and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - name: resolve the request
        id: request
        env:
          SHA: ${{ github.event.client_payload.spec_sha || inputs.spec_sha }}
        run: |
          test -n "$SHA" || { echo 'spec_sha is required' >&2; exit 1; }
          case "$SHA" in
            *[!0-9a-f]* | "") echo "spec_sha must be a hex commit sha: $SHA" >&2; exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%.12s' "$SHA")" >> "$GITHUB_OUTPUT"

      - name: fetch the spec
        env:
          # The monorepo is private, so this needs a token of its own. It is
          # read from a secret, never from the dispatch payload -- anyone who
          # can read a workflow run can read client_payload.
          GH_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          SHA: ${{ steps.request.outputs.sha }}
        run: |
          test -n "$GH_TOKEN" || {
            echo 'MONOREPO_READ_TOKEN is not set; this repository cannot read the spec.' >&2
            exit 1
          }
          gh api "repos/${SPEC_REPO}/contents/${SPEC_PATH}?ref=${SHA}" \
            --header 'Accept: application/vnd.github.raw' \
            > openapi/rivalika-public-api.json
          python3 -m json.tool openapi/rivalika-public-api.json > /dev/null

      - name: regenerate
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            --entrypoint openapi-generator-cli \
            openapitools/openapi-generator-cli:v7.22.0 \
            generate -c openapi-generator-config.json

      - name: open a pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 (Node 24)
        with:
          branch: bot/openapi-${{ steps.request.outputs.short }}
          delete-branch: true
          commit-message: 'chore: regenerate from OpenAPI ${{ steps.request.outputs.short }}'
          title: 'chore: regenerate from OpenAPI ${{ steps.request.outputs.short }}'
          body: |
            Generated from the monorepo's public API spec at
            [`${{ steps.request.outputs.short }}`](https://github.com/zelqonw/rivalika/commit/${{ steps.request.outputs.sha }}).

            The SDK is generated code. Review this the way you would review the
            API change that caused it: what moved, what disappeared, and
            whether anything here breaks somebody already on the previous
            version.

            A sync that changes nothing opens no pull request at all.

  notification-outcome:
    name: Record notification outcome
    continue-on-error: true
    if: always()
    needs: [regenerate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Write sanitized outcome
        env:
          NOTIFY_KIND: sync
          NOTIFY_SOURCE: ${{ needs.regenerate.outputs.source }}
          NOTIFY_PR: ${{ needs.regenerate.outputs.pr }}
          NOTIFY_OUTCOME: ${{ needs.regenerate.result == 'failure' && 'failed' || needs.regenerate.outputs.operation == 'created' && 'review-ready' || needs.regenerate.outputs.operation == 'updated' && 'review-ready' || 'unchanged' }}
          NOTIFY_STAGE: ${{ needs.regenerate.result == 'failure' && 'regenerate' || 'complete' }}
        run: node scripts/notifications/write-outcome.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: notification-outcome-${{ github.run_attempt }}-sync
          path: output/notifications/outcome.json
          retention-days: 14
