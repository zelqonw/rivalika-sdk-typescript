name: Sync OpenAPI
# The monorepo finds the run it dispatched by this title and waits for its
# result, so a failed sync shows up as a failed "Sync SDKs" run there.
run-name: Sync OpenAPI ${{ github.event.client_payload.request_id || inputs.request_id || github.event.client_payload.spec_sha || inputs.spec_sha }}

# The monorepo sends this when the public API spec on its main differs from
# the spec committed here (and from the pending bot/openapi-sync branch).
#
# The spec is ~256 KB, well over the 64 KB a client_payload can carry, so the
# payload names the commit and this job fetches it.
on:
  repository_dispatch:
    types: [openapi-updated]
  workflow_dispatch:
    inputs:
      spec_sha:
        description: Monorepo commit to generate from
        required: true
      request_id:
        description: Optional correlation id shown in the run name
        required: false

permissions:
  contents: read

concurrency:
  group: sync-openapi
  cancel-in-progress: false

env:
  SPEC_REPO: zelqonw/rivalika
  SPEC_PATH: packages/contracts/openapi/generated/rivalika-public-api.json
  SYNC_BRANCH: bot/openapi-sync

jobs:
  regenerate:
    name: regenerate and open a pull request
    runs-on: [self-hosted, rivalika, heavy]
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Starts Verify on the bot branch: pull requests opened with
      # GITHUB_TOKEN trigger no workflows, but workflow_dispatch is allowed.
      actions: write
    steps:
      # Jobs from older workflow versions ran as root and left root-owned
      # files that break actions/checkout; hand them back to the runner user.
      - name: reclaim the workspace
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" --entrypoint chown \
            openapitools/openapi-generator-cli:v7.22.0 -R "$(id -u):$(id -g)" /work
      - uses: actions/checkout@v6

      - name: resolve the request
        id: request
        env:
          SHA: ${{ github.event.client_payload.spec_sha || inputs.spec_sha }}
        run: |
          test -n "$SHA" || { echo 'spec_sha is required' >&2; exit 1; }
          case "$SHA" in
            *[!0-9a-f]* | "") echo "spec_sha must be a hex commit sha: $SHA" >&2; exit 1 ;;
          esac
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(printf '%.12s' "$SHA")" >> "$GITHUB_OUTPUT"

      - name: fetch the spec
        env:
          # The monorepo is private, so this needs a token of its own. It is
          # read from a secret, never from the dispatch payload -- anyone who
          # can read a workflow run can read client_payload.
          GH_TOKEN: ${{ secrets.MONOREPO_READ_TOKEN }}
          SHA: ${{ steps.request.outputs.sha }}
        # curl, not gh: the self-hosted runners do not all have the GitHub CLI.
        run: |
          test -n "$GH_TOKEN" || {
            echo 'MONOREPO_READ_TOKEN is not set; this repository cannot read the spec.' >&2
            exit 1
          }
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github.raw' \
            --output openapi/rivalika-public-api.json \
            "https://api.github.com/repos/${SPEC_REPO}/contents/${SPEC_PATH}?ref=${SHA}"
          python3 -m json.tool openapi/rivalika-public-api.json > /dev/null

      - name: regenerate
        # As the runner user: files a root container writes into the
        # persistent workspace break every later checkout on this runner.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/work" -w /work \
            --entrypoint openapi-generator-cli \
            openapitools/openapi-generator-cli:v7.22.0 \
            generate -c openapi-generator-config.json

      - name: open a pull request
        id: pull-request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 (Node 24)
        with:
          # One standing branch: a newer spec updates the open pull request
          # instead of opening another one.
          branch: ${{ env.SYNC_BRANCH }}
          base: main
          delete-branch: true
          commit-message: 'chore: regenerate from OpenAPI ${{ steps.request.outputs.short }}'
          title: 'chore: regenerate from OpenAPI ${{ steps.request.outputs.short }}'
          body: |
            Generated from the monorepo's public API spec at
            [`${{ steps.request.outputs.short }}`](https://github.com/zelqonw/rivalika/commit/${{ steps.request.outputs.sha }}).

            The SDK is generated code. Review this the way you would review the
            API change that caused it: what moved, what disappeared, and
            whether anything here breaks somebody already on the previous
            version.

            A sync that changes nothing opens no pull request at all.

      - name: verify the pull request
        if: steps.pull-request.outputs.pull-request-operation == 'created' || steps.pull-request.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 3 --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --data "{\"ref\":\"${SYNC_BRANCH}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/dispatches"
