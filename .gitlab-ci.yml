stages: [verify, publish]

verify:
  stage: verify
  image: node:24-bookworm
  script:
    - npm ci
    - npm run check

generation-drift:
  stage: verify
  image:
    name: openapitools/openapi-generator-cli:v7.22.0
    entrypoint: [""]
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - openapi-generator-cli generate -c openapi-generator-config.json
    - git diff --exit-code

sync-openapi:
  stage: verify
  image:
    name: openapitools/openapi-generator-cli:v7.22.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $RIVALIKA_OPENAPI_URL && $RIVALIKA_OPENAPI_SHA'
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - >-
      curl --fail --silent --show-error --header "JOB-TOKEN:$CI_JOB_TOKEN"
      "$RIVALIKA_OPENAPI_URL" --output openapi/rivalika-public-api.json
    - openapi-generator-cli generate -c openapi-generator-config.json
    - |
      if git diff --quiet; then
        echo "SDK is already synchronized with ${RIVALIKA_OPENAPI_SHA}"
        exit 0
      fi
    - git config user.name "Rivalika SDK Bot"
    - git config user.email "sdk-bot@rivalika.com"
    - export SDK_SYNC_BRANCH="bot/openapi-${RIVALIKA_OPENAPI_SHA}"
    - git switch -c "$SDK_SYNC_BRANCH"
    - git add --all
    - >-
      git commit -m "chore: regenerate from OpenAPI ${RIVALIKA_OPENAPI_SHA}"
    - >-
      git push -o merge_request.create -o merge_request.target=main
      -o merge_request.remove_source_branch
      -o merge_request.title="chore: regenerate from OpenAPI ${RIVALIKA_OPENAPI_SHA}"
      "https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
      "HEAD:${SDK_SYNC_BRANCH}"
    - >-
      curl --fail --silent --show-error --request POST
      --form "token=$CI_JOB_TOKEN" --form "ref=$SDK_SYNC_BRANCH"
      "$CI_API_V4_URL/projects/$CI_PROJECT_ID/trigger/pipeline" > /dev/null

publish:
  stage: publish
  image: node:24-bookworm
  environment: npm
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_TAG == "v1.0.0-beta.1"'
  script:
    - npm ci
    - npm run check
    - npm publish
